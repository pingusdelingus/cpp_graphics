<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../Common/webgl2-shader-editor.css">

<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es

in vec4 vPosition;

// STEP 3
// Declare model2clip.
uniform mat4 model2clip;

void
main()
{
    // STEP 3
    // vPosition is in model coordinates
    // gl_Position should be clip coordinates.
    gl_Position = model2clip * vPosition;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es

precision mediump float;

uniform vec4 color;
out vec4 fColor;

void
main()
{
    fColor = color;
}
</script>

<script type="text/javascript" src="../Common/PVMat.js"></script>
<script type="text/javascript" src="../Common/webgl2-shader-editor.js"></script>
<script type="text/javascript" src="cube.js"></script>
<script type="text/javascript" src="view.js"></script>
</head>

<body>
<button id="MyButton">My Button</button>
<button id="ZPlus">z + 0.1</button>
<button id="ZMinus">z - 0.1</button>
<p>
<canvas id="gl-canvas" width="960" height="540">

</body>
</html>
